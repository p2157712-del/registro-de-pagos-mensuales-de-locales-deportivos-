
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asignaciones | Nexus Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
     
</head>
<body>
    <div class="container">
        <div class="view active">
            <div class="header">
                <div class="admin-badge">
                    <div class="admin-avatar" id="admin-initials">AD</div>
                    <div>
                        <h4 style="font-size: 1.1rem; font-weight: 700;" id="admin-name">Administrador</h4>
                        <span style="font-size: 0.8rem; color: var(--success);"><i class="fas fa-circle" style="font-size: 6px;"></i> Sesión Activa</span>
                    </div>
                </div>
                <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Cerrar Sesión</button>
            </div>

            <div class="tabs">
                <a href="deportes.html" class="tab-btn"><i class="fas fa-futbol"></i> Deportes</a>
                <a href="entrenadores.html" class="tab-btn"><i class="fas fa-user-tie"></i> Entrenadores</a>
                <a href="asignaciones.html" class="tab-btn active"><i class="fas fa-link"></i> Asignaciones</a>
                <a href="atletas.html" class="tab-btn"><i class="fas fa-users"></i> Atletas</a>
                <a href="pagos.html" class="tab-btn"><i class="fas fa-cash-register"></i> Pagos</a>
                <a href="/registro-de-pagos-mensuales-de-locales-deportivos/index.html" class="...">Cerrar Sesión</a>
            </div>

            <div class="card">
                <h4 style="margin-bottom: 20px; font-weight: 700;"><i class="fas fa-link text-primary"></i> Asignar Deportes</h4>
                <input type="hidden" id="asignacion-id">
                <div class="form-group"> 
                    <label for="select-entrenador">Seleccionar Entrenador:</label>
                    <select id="select-entrenador" required>
                        <option value="">-- Seleccione --</option>
                    </select>
                </div>
                <div class="form-group">
                <label style="font-weight: bold;font-size: 1rem;"> lista de deporte </label>
                  </div>   

                    <div class="checkbox-group-container" id="sports-container-box" style="display: block;">
                        <label style="font-size: 0.8rem; margin-bottom: 8px;">Seleccione uno o más:</label>
                        <div class="checkbox-group" id="deportes-checkbox-container"></div>
                    </div>
                </div>
                <button id="btn-save-asignacion" onclick="guardarAsignacion()"> Guardar Asignación </button>
            </div>


            <div class="table-container">
                <h4 style="margin-bottom: 15px; font-weight: 700;">Asignaciones Activas</h4>
                <table>
                    <thead>
                        <tr>
                            <th>Entrenador</th>
                            <th>Deportes Asignados</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="table-asignaciones-body"></tbody>
                </table>
            </div>
        </div>
    </div>

   <script src="script/libreria compartida.js"></script> 
   <script type="module" src="script/db.js"></script>
  <script src="script/asignaciones.js"></script> 

</body>
</html>
